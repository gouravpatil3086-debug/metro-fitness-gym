<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Metro Fitness | Pro Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0f1e; min-height: 100vh; padding: 1rem; color: white; }
        .app-container { max-width: 1200px; margin: auto; background: rgba(18, 25, 45, 0.9); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { padding: 1.5rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .logo h1 { font-size: 1.5rem; color: #FF8C42; }
        .dashboard { padding: 1.5rem; }
        .data-card { background: #1e293b; padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        a { color: #FFD166; text-decoration: none; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 5px; }
        button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #FF8C42; color: #000; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-renew { background: #6c5ce7; color: white; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:9999; }
        .modal-content { background:#1e293b; padding:2rem; border-radius:1rem; width:90%; max-width:400px; border: 1px solid #FF8C42; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo"><h1>METRO FITNESS</h1></div>
        <button id="logoutBtn" style="display:none; background:red; color:white;">Logout</button>
    </div>

    <div id="loginSection" style="padding:50px; text-align:center;">
        <div class="data-card" style="max-width:350px; margin:auto;">
            <h2>Admin Login</h2>
            <input type="text" id="user" placeholder="User">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-primary" onclick="login()" style="width:100%;">Login</button>
        </div>
    </div>

    <div id="dashboard" style="display:none;" class="dashboard">
        <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="openModal('regModal')">+ New Member</button>
            <button class="btn-renew" onclick="addStaff()">+ Add Staff</button>
            <button style="background:#475569; color:white;" onclick="addEquip()">+ Equipment</button>
        </div>

        <div class="data-card">
            <h3>Members List</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Name</th><th>Phone (Call)</th><th>Expiry</th><th>Actions</th></tr></thead>
                    <tbody id="mList"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="regModal" class="modal">
    <div class="modal-content">
        <h3>New Registration</h3>
        <input type="text" id="mName" placeholder="Name">
        <input type="tel" id="mPhone" placeholder="Phone">
        <select id="mPlan">
            <option value="1 Month - ₹1000">1 Month - ₹1000</option>
            <option value="3 Months - ₹2800">3 Months - ₹2800</option>
            <option value="1 Year - ₹12000">1 Year - ₹12000</option>
        </select>
        <button class="btn-primary" onclick="saveMember()" style="width:100%;">Save & Send Receipt</button>
        <button onclick="closeModal('regModal')" style="width:100%; margin-top:5px; background:none; color:white;">Cancel</button>
    </div>
</div>

<div id="renewModal" class="modal">
    <div class="modal-content">
        <h3>Renew Membership</h3>
        <p id="renewMemberName" style="color:#FFD166;"></p>
        <select id="rPlan">
            <option value="1 Month - ₹1000">1 Month - ₹1000</option>
            <option value="3 Months - ₹2800">3 Months - ₹2800</option>
            <option value="1 Year - ₹12000">1 Year - ₹12000</option>
        </select>
        <button class="btn-renew" id="confirmRenewBtn" style="width:100%;">Confirm Renewal</button>
        <button onclick="closeModal('renewModal')" style="width:100%; margin-top:5px; background:none; color:white;">Cancel</button>
    </div>
</div>

<script>
    const sheetURL = "https://script.google.com/macros/s/AKfycbwbeIEedfDryYl-1OKuUOmESOVkQKjdFnS1d__UryJVtPvfXDqbncfwI1bn7xLL-F-d/exec";
    let members = JSON.parse(localStorage.getItem('metro_m')) || [];
    let currentRenewId = null;

    function login() {
        if(document.getElementById('user').value==='admin' && document.getElementById('pass').value==='admin123') {
            document.getElementById('loginSection').style.display='none';
            document.getElementById('dashboard').style.display='block';
            render();
        }
    }

    function sync(data, type) {
        fetch(sheetURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({...data, entryType: type}) });
    }

    function render() {
        document.getElementById('mList').innerHTML = members.map(m => `
            <tr>
                <td>${m.name}</td>
                <td><a href="tel:${m.phone}"><i class="fas fa-phone"></i> ${m.phone}</a></td>
                <td>${m.expiry}</td>
                <td>
                    <button class="btn-renew" onclick="openRenew('${m.id}', '${m.name}')">Renew</button>
                    <button class="btn-whatsapp" onclick="sendWA('${m.phone}','${m.name}','${m.expiry}','${m.id}')"><i class="fab fa-whatsapp"></i></button>
                    <button style="background:red; color:white;" onclick="del('${m.id}')">X</button>
                </td>
            </tr>
        `).join('');
    }

    function saveMember() {
        const name = document.getElementById('mName').value;
        const phone = document.getElementById('mPhone').value;
        const plan = document.getElementById('mPlan').value;
        if(!name || !phone) return;

        const exp = new Date();
        exp.setMonth(exp.getMonth() + (plan.includes('1 Month') ? 1 : plan.includes('3') ? 3 : 12));
        
        const m = { id: "ID"+Date.now(), name, phone, plan, expiry: exp.toISOString().split('T')[0] };
        members.push(m);
        localStorage.setItem('metro_m', JSON.stringify(members));
        sync(m, 'Member_Reg');
        render();
        closeModal('regModal');
        sendWA(m.phone, m.name, m.expiry, m.id);
    }

    function openRenew(id, name) {
        currentRenewId = id;
        document.getElementById('renewMemberName').innerText = "Renewing for: " + name;
        openModal('renewModal');
    }

    document.getElementById('confirmRenewBtn').onclick = () => {
        const plan = document.getElementById('rPlan').value;
        const idx = members.findIndex(m => m.id === currentRenewId);
        const exp = new Date();
        exp.setMonth(exp.getMonth() + (plan.includes('1 Month') ? 1 : plan.includes('3') ? 3 : 12));
        
        members[idx].expiry = exp.toISOString().split('T')[0];
        members[idx].plan = plan;
        
        localStorage.setItem('metro_m', JSON.stringify(members));
        sync(members[idx], 'Renewal');
        render();
        closeModal('renewModal');
        sendWA(members[idx].phone, members[idx].name, members[idx].expiry, members[idx].id);
    };

    function sendWA(phone, name, exp, id) {
        const url = window.location.href.split('index.html')[0];
        const link = `${url}view-invoice.html?name=${encodeURIComponent(name)}&expiry=${exp}&id=${id}`;
        const msg = `*METRO FITNESS RECEIPT*%0AHello ${name}, your payment is confirmed!%0ANew Expiry: ${exp}%0AView Invoice: ${link}`;
        window.open(`https://wa.me/91${phone.replace(/\D/g,'')}?text=${msg}`, '_blank');
    }

    function addStaff() {
        const n = prompt("Staff Name:");
        if(n) {
            const s = { name: n, type: 'Staff', date: new Date().toLocaleDateString() };
            sync(s, 'Staff_Reg');
            alert("Staff saved to Google Sheets");
        }
    }

    function addEquip() {
        const e = prompt("Equipment Name:");
        if(e) {
            const eq = { name: e, type: 'Equipment', date: new Date().toLocaleDateString() };
            sync(eq, 'Equip_Reg');
            alert("Equipment saved to Google Sheets");
        }
    }

    function del(id) { members = members.filter(m => m.id !== id); localStorage.setItem('metro_m', JSON.stringify(members)); render(); }
    function openModal(id) { document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
</script>
</body>
</html>
