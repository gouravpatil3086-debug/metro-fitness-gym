<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Metro Fitness | Gym Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%); min-height: 100vh; padding: 1.5rem; color: white; }
        
        .app-container { max-width: 1400px; margin: 2rem auto; background: rgba(18, 25, 45, 0.8); backdrop-filter: blur(10px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5); overflow: hidden; }
        .header { padding: 1.2rem 2rem; background: rgba(10, 15, 30, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo h1 { font-size: 1.9rem; font-weight: 800; background: linear-gradient(135deg, #FFD166, #FF8C42); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .login-forms { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; padding: 3rem; }
        .card { background: rgba(25, 32, 50, 0.95); border-radius: 1.2rem; padding: 2rem; border: 1px solid rgba(255, 255, 255, 0.05); width: 320px; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; }
        button { background: #FF8C42; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0a0f1e; width: 100%; margin-top: 10px; }
        
        .data-card { background: #0d1322cc; border-radius: 1.5rem; padding: 1.5rem; margin: 1.5rem; border: 1px solid rgba(255,255,255,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a3448; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a2e; width: 90%; max-width: 500px; padding: 2rem; border-radius: 1.5rem; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; right: 1rem; top: 1rem; cursor: pointer; color: #FF8C42; font-size: 1.5rem; }
        
        .expiring-row { background: rgba(239, 68, 68, 0.15); }
        .member-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .search-box { width: 250px; float: right; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo"><h1><i class="fas fa-dumbbell"></i> METRO FITNESS</h1></div>
        <div class="user-panel">
            <span id="userStatusDisplay" class="user-badge">Not logged in</span>
            <button id="logoutBtn" style="display:none; width:auto; background:#3a2c2f; color:#ffab7b;">Logout</button>
        </div>
    </div>

    <div id="loginSection" class="login-forms">
        <div class="card">
            <h3>Admin Login</h3>
            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">
            <button id="adminLoginBtn">Login as Admin</button>
        </div>
        <div class="card">
            <h3>Staff Login</h3>
            <input type="text" id="staffUser" placeholder="Staff ID">
            <input type="password" id="staffPass" placeholder="Password">
            <button id="staffLoginBtn">Login as Staff</button>
        </div>
    </div>

    <div id="dashboardPanel" style="display: none; padding: 20px;">
        <div class="action-bar" style="margin-bottom:20px; display:flex; gap:10px;">
            <button id="registerMemberBtn" style="width:auto;">+ Register Member</button>
            <button id="registerStaffBtn" style="width:auto; background:#6c5ce7; color:white;">+ Register Staff</button>
        </div>

        <div class="data-card">
            <h2>Members <input type="text" id="memberSearch" placeholder="Search..." class="search-box"></h2>
            <table id="membersTable">
                <thead>
                    <tr><th>Photo</th><th>ID</th><th>Name</th><th>Phone</th><th>Expiry</th><th>Actions</th></tr>
                </thead>
                <tbody id="membersTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="memberRegModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeMemberModal">&times;</span>
        <h2>New Member</h2>
        <input type="text" id="memName" placeholder="Full Name">
        <input type="tel" id="memPhone" placeholder="Phone">
        <select id="memPlan">
            <option value="1 Month - ₹1000">1 Month - ₹1000</option>
            <option value="3 Months - ₹2800">3 Months - ₹2800</option>
            <option value="1 Year - ₹12000">1 Year - ₹12000</option>
        </select>
        <button id="confirmMemberBtn">Confirm & Save</button>
    </div>
</div>

<script>
    // Data Storage
    let gymMembers = JSON.parse(localStorage.getItem('metro_members')) || [];
    let currentUser = null;

    // Login Logic
    document.getElementById('adminLoginBtn').onclick = () => {
        if(document.getElementById('adminUser').value === 'admin' && document.getElementById('adminPass').value === 'admin123') {
            loginSucceed('Admin');
        } else { alert("Wrong credentials"); }
    };

    function loginSucceed(role) {
        currentUser = role;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardPanel').style.display = 'block';
        document.getElementById('userStatusDisplay').innerText = role;
        document.getElementById('logoutBtn').style.display = 'block';
        renderMembers();
    }

    // Render Table
    function renderMembers() {
        const tbody = document.getElementById('membersTableBody');
        tbody.innerHTML = gymMembers.map(m => `
            <tr>
                <td><i class="fas fa-user-circle fa-2x"></i></td>
                <td>${m.id}</td>
                <td>${m.name}</td>
                <td>${m.phone}</td>
                <td>${m.expiryDate}</td>
                <td><button onclick="deleteMember('${m.id}')" style="background:red; color:white; padding:5px; width:auto;">Delete</button></td>
            </tr>
        `).join('');
    }

    // Member Registration
    document.getElementById('registerMemberBtn').onclick = () => {
        document.getElementById('memberRegModal').style.display = 'flex';
    };

    document.getElementById('closeMemberModal').onclick = () => {
        document.getElementById('memberRegModal').style.display = 'none';
    };

    document.getElementById('confirmMemberBtn').onclick = () => {
        const name = document.getElementById('memName').value;
        const phone = document.getElementById('memPhone').value;
        const plan = document.getElementById('memPlan').value;

        if(!name || !phone) return alert("Fill all fields");

        const expiry = new Date();
        expiry.setMonth(expiry.getMonth() + (plan.includes('1 Month') ? 1 : plan.includes('3') ? 3 : 12));

        const newMember = {
            id: 'M' + Math.floor(Math.random() * 1000),
            name,
            phone,
            plan,
            expiryDate: expiry.toISOString().split('T')[0]
        };

        gymMembers.push(newMember);
        localStorage.setItem('metro_members', JSON.stringify(gymMembers));
        renderMembers();
        document.getElementById('memberRegModal').style.display = 'none';
    };

    function deleteMember(id) {
        gymMembers = gymMembers.filter(m => m.id !== id);
        localStorage.setItem('metro_members', JSON.stringify(gymMembers));
        renderMembers();
    }

    document.getElementById('logoutBtn').onclick = () => { location.reload(); };
</script>

</body>
</html>
