function generateReceipt(member) {
    const joiningDate = new Date().toLocaleDateString();
    let expiry = new Date();
    // Logic to add months based on plan
    if(member.plan.includes("1 Month")) expiry.setMonth(expiry.getMonth() + 1);
    else if(member.plan.includes("3 Months")) expiry.setMonth(expiry.getMonth() + 3);
    else if(member.plan.includes("1 Year")) expiry.setFullYear(expiry.getFullYear() + 1);
    
    const expiryDate = expiry.toLocaleDateString();

    const receiptHtml = `
        <div style="background: #fff; color: #000; padding: 20px; border-radius: 10px; margin-top: 20px; border: 2px solid #FFD166;">
            <h3 style="text-align:center;">METRO FITNESS RECEIPT</h3>
            <p><strong>Member:</strong> ${member.name}</p>
            <p><strong>Joining:</strong> ${joiningDate}</p>
            <p><strong>Expiry:</strong> ${expiryDate}</p>
            <p><strong>Paid:</strong> ${member.amount}</p>
            <p style="text-align:center; font-style:italic;">Thank you for joining Metro Fitness!</p>
            <button onclick="window.open('https://wa.me/${member.phone}?text=Hello ${member.name}, your payment is confirmed. Expiry: ${expiryDate}. Thank you!')" 
                style="background:#25D366; width:100%; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer;">
                <i class="fab fa-whatsapp"></i> Send to WhatsApp
            </button>
        </div>
    `;
    document.getElementById('memberReceiptArea').innerHTML = receiptHtml;
}
function uploadToSheets(data) {
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwbeIEedfDryYl-1OKuUOmESOVkQKjdFnS1d__UryJVtPvfXDqbncfwI1bn7xLL-F-d/exec'; 
  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors', 
    body: JSON.stringify(data)
  })
  .then(() => console.log("Cloud Backup Successful"))
  .catch(error => console.error('Backup Error:', error));
}
