<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Metro Fitness | Complete Gym Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* CORE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%); min-height: 100vh; padding: 1.5rem; color: white; }
        .app-container { max-width: 1400px; margin: 2rem auto; background: rgba(18, 25, 45, 0.8); backdrop-filter: blur(10px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5); overflow: hidden; }
        
        /* HEADER */
        .header { padding: 1.2rem 2rem; background: rgba(10, 15, 30, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo h1 { font-size: 1.9rem; font-weight: 800; background: linear-gradient(135deg, #FFD166, #FF8C42); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-flex; align-items: center; gap: 10px; }
        .user-badge { color: white; font-weight: 500; background: #1e2a3e; padding: 5px 14px; border-radius: 30px; font-size: 0.85rem; margin-right: 10px; }

        /* DASHBOARD & CARDS */
        .dashboard { padding: 2rem; }
        .data-card { background: #0d1322cc; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.08); }
        .data-card h2 { color: #FFD166; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        
        /* LOGIN */
        .login-forms { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; padding: 3rem; }
        .card { background: rgba(25, 32, 50, 0.95); border-radius: 1.2rem; padding: 2rem; border: 1px solid rgba(255, 255, 255, 0.05); width: 350px; }
        
        /* TABLES */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
        td { background: rgba(30, 41, 59, 0.5); padding: 12px; font-size: 0.9rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        tr:hover td { background: rgba(51, 65, 85, 0.5); }
        .expiring-row td { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); }

        /* INPUTS & BUTTONS */
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; }
        button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #FF8C42; color: #0a0f1e; }
        .btn-secondary { background: #2c7a4d; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: #1a1a2e; width: 100%; max-width: 500px; padding: 2rem; border-radius: 1.5rem; position: relative; border: 1px solid #FF8C42; }
        .close-modal { position: absolute; right: 1.5rem; top: 1rem; cursor: pointer; color: #FF8C42; font-size: 1.5rem; }

        /* QR SECTION */
        .qr-container { background: white; padding: 15px; border-radius: 12px; text-align: center; margin: 15px 0; display: none; }
        .upi-id { color: #0a0f1e; font-weight: 700; margin-top: 10px; font-size: 0.9rem; }
        #memberQrcode img { margin: 0 auto; }

        .search-box { background: #0a0f1c; border: 1px solid #FF8C42; border-radius: 20px; padding: 8px 15px; color: white; width: 200px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo"><h1><i class="fas fa-dumbbell"></i> METRO FITNESS</h1></div>
        <div>
            <span id="userStatusDisplay" class="user-badge">Not Logged In</span>
            <button id="logoutBtn" class="btn-danger" style="display:none; width:auto; padding:5px 15px;">Logout</button>
        </div>
    </div>

    <div id="loginSection" class="login-forms">
        <div class="card">
            <h3 style="color:#FFD166; margin-bottom:15px;">Admin Portal</h3>
            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">
            <button id="adminLoginBtn" class="btn-primary">Login as Admin</button>
        </div>
        <div class="card">
            <h3 style="color:#FFD166; margin-bottom:15px;">Staff Portal</h3>
            <input type="text" id="staffUser" placeholder="Staff ID">
            <input type="password" id="staffPass" placeholder="Password">
            <button id="staffLoginBtn" class="btn-primary">Login as Staff</button>
        </div>
    </div>

    <div id="dashboardPanel" style="display: none;" class="dashboard">
        <div class="action-bar" style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
            <button id="registerMemberBtn" class="btn-secondary"><i class="fas fa-user-plus"></i> Register Member</button>
            <button id="registerStaffBtn" class="btn-secondary" style="background:#6c5ce7;"><i class="fas fa-user-tie"></i> Register Staff</button>
            <button id="broadcastReminderBtn" class="btn-primary" style="background:#e17055;"><i class="fab fa-whatsapp"></i> Broadcast Expiry</button>
        </div>

        <div class="data-card">
            <h2>Gym Members <input type="text" id="memberSearch" placeholder="Search..." class="search-box"></h2>
            <div style="overflow-x:auto;">
                <table id="membersTable">
                    <thead>
                        <tr><th>Name</th><th>Phone</th><th>Plan</th><th>Expiry Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="membersTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="staffCard" class="data-card" style="display:none;">
            <h2>Staff Directory</h2>
            <div style="overflow-x:auto;">
                <table id="staffTable">
                    <thead>
                        <tr><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="staffTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="data-card">
            <h2>Equipment Status <button id="addEquipBtn" class="btn-secondary" style="font-size:0.8rem;">+ Add</button></h2>
            <div style="overflow-x:auto;">
                <table id="equipmentTable">
                    <thead>
                        <tr><th>Equipment</th><th>Status</th><th>Next Due</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="equipmentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="memberRegModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeMemberModal">&times;</span>
        <h2 style="color:#FFD166; margin-bottom:15px;">Register Member</h2>
        <input type="text" id="memName" placeholder="Full Name *">
        <input type="tel" id="memPhone" placeholder="Phone *">
        <select id="memPlan">
            <option value="1 Month - ₹1000">1 Month - ₹1000</option>
            <option value="3 Months - ₹2800">3 Months - ₹2800</option>
            <option value="1 Year - ₹12000">1 Year - ₹12000</option>
        </select>
        
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button id="payOnlineBtn" class="btn-secondary" style="flex:1;">UPI QR</button>
            <button id="payCashBtn" class="btn-primary" style="flex:1;">Cash</button>
        </div>

        <div id="qrSection" class="qr-container">
            <div id="memberQrcode"></div>
            <div class="upi-id">UPI: gouravpatil3086@okicici</div>
            <input type="text" id="txnId" placeholder="Transaction ID" style="background:#eee; color:#000;">
        </div>

        <button id="saveMemberBtn" class="btn-primary" style="margin-top:20px; width:100%;">Finalize Registration</button>
        <div id="receiptArea"></div>
    </div>
</div>

<div id="staffRegModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeStaffModal">&times;</span>
        <h2 style="color:#FFD166;">Register Staff</h2>
        <input type="text" id="sName" placeholder="Full Name">
        <input type="tel" id="sPhone" placeholder="Phone">
        <input type="email" id="sEmail" placeholder="Email">
        <button id="saveStaffBtn" class="btn-secondary" style="margin-top:10px; width:100%;">Save Staff Member</button>
    </div>
</div>

<script>
    // DATA INITIALIZATION
    let gymMembers = JSON.parse(localStorage.getItem('metro_members')) || [];
    let staffList = JSON.parse(localStorage.getItem('metro_staff')) || [];
    let equipment = JSON.parse(localStorage.getItem('metro_equipment')) || [];
    let currentUser = null;
    let currentPaymentMethod = 'Cash';

    // LOGIN
    document.getElementById('adminLoginBtn').onclick = () => {
        if(document.getElementById('adminUser').value==='admin' && document.getElementById('adminPass').value==='admin123'){
            setupDashboard('Admin');
        } else alert("Invalid Admin Credentials");
    };

    document.getElementById('staffLoginBtn').onclick = () => {
        if(document.getElementById('staffUser').value==='staff' && document.getElementById('staffPass').value==='staff123'){
            setupDashboard('Staff');
        } else alert("Invalid Staff Credentials");
    };

    function setupDashboard(role) {
        currentUser = role;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardPanel').style.display = 'block';
        document.getElementById('userStatusDisplay').innerText = role;
        document.getElementById('logoutBtn').style.display = 'inline-block';
        if(role === 'Admin') document.getElementById('staffCard').style.display = 'block';
        renderAll();
    }

    // RENDERING
    function renderAll() {
        renderMembers();
        renderStaff();
        renderEquipment();
    }

    function renderMembers() {
        const tbody = document.getElementById('membersTableBody');
        const searchTerm = document.getElementById('memberSearch').value.toLowerCase();
        tbody.innerHTML = gymMembers
            .filter(m => m.name.toLowerCase().includes(searchTerm))
            .map(m => {
                const isExpiring = (new Date(m.expiryDate) - new Date()) / (1000*60*60*24) <= 3;
                return `<tr class="${isExpiring ? 'expiring-row' : ''}">
                    <td>${m.name}</td>
                    <td>${m.phone}</td>
                    <td>${m.plan}</td>
                    <td>${m.expiryDate}</td>
                    <td>
                        <button onclick="sendWA('${m.phone}', '${m.name}', '${m.expiryDate}')" class="btn-whatsapp" style="padding:5px 10px;"><i class="fab fa-whatsapp"></i></button>
                        <button onclick="deleteItem('member', '${m.id}')" class="btn-danger" style="padding:5px 10px;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
    }

    function renderStaff() {
        document.getElementById('staffTableBody').innerHTML = staffList.map(s => `
            <tr><td>${s.name}</td><td>${s.phone}</td><td>${s.email}</td>
            <td><button onclick="deleteItem('staff', '${s.id}')" class="btn-danger">Delete</button></td></tr>
        `).join('');
    }

    function renderEquipment() {
        document.getElementById('equipmentTableBody').innerHTML = equipment.map((e, index) => `
            <tr><td>${e.name}</td><td>${e.status}</td><td>${e.due}</td>
            <td><button onclick="deleteItem('equip', ${index})" class="btn-danger">Delete</button></td></tr>
        `).join('');
    }

    // MODAL CONTROLS
    document.getElementById('registerMemberBtn').onclick = () => document.getElementById('memberRegModal').style.display = 'flex';
    document.getElementById('closeMemberModal').onclick = () => {
        document.getElementById('memberRegModal').style.display = 'none';
        document.getElementById('receiptArea').innerHTML = '';
        document.getElementById('qrSection').style.display = 'none';
    };
    document.getElementById('registerStaffBtn').onclick = () => document.getElementById('staffRegModal').style.display = 'flex';
    document.getElementById('closeStaffModal').onclick = () => document.getElementById('staffRegModal').style.display = 'none';

    // PAYMENT
    document.getElementById('payOnlineBtn').onclick = () => {
        currentPaymentMethod = 'Online';
        const plan = document.getElementById('memPlan').value;
        const amount = plan.split('₹')[1];
        document.getElementById('qrSection').style.display = 'block';
        document.getElementById('memberQrcode').innerHTML = '';
        new QRCode(document.getElementById('memberQrcode'), {
            text: `upi://pay?pa=gouravpatil3086@okicici&am=${amount}&cu=INR`,
            width: 128, height: 128
        });
    };
    document.getElementById('payCashBtn').onclick = () => {
        currentPaymentMethod = 'Cash';
        document.getElementById('qrSection').style.display = 'none';
    };

    // SAVE ACTIONS
    document.getElementById('saveMemberBtn').onclick = () => {
        const name = document.getElementById('memName').value;
        const phone = document.getElementById('memPhone').value;
        const plan = document.getElementById('memPlan').value;
        if(!name || !phone) return alert("Required fields missing");

        const expiry = new Date();
        if(plan.includes('1 Month')) expiry.setMonth(expiry.getMonth() + 1);
        else if(plan.includes('3')) expiry.setMonth(expiry.getMonth() + 3);
        else expiry.setFullYear(expiry.getFullYear() + 1);

        const newMem = {
            id: Date.now().toString(),
            name, phone, plan, 
            expiryDate: expiry.toISOString().split('T')[0],
            method: currentPaymentMethod
        };

        gymMembers.push(newMem);
        localStorage.setItem('metro_members', JSON.stringify(gymMembers));
        renderMembers();
        
        document.getElementById('receiptArea').innerHTML = `
            <div style="background:#fff; color:#000; padding:15px; border-radius:10px; margin-top:15px; border:2px solid #FF8C42;">
                <h3 style="text-align:center;">METRO FITNESS RECEIPT</h3>
                <p>Member: ${name}</p><p>Expiry: ${newMem.expiryDate}</p>
                <button onclick="sendWA('${phone}', '${name}', '${newMem.expiryDate}')" class="btn-whatsapp" style="width:100%; margin-top:10px;">Send Receipt via WhatsApp</button>
            </div>`;
    };

    document.getElementById('saveStaffBtn').onclick = () => {
        const s = { id: Date.now(), name: document.getElementById('sName').value, phone: document.getElementById('sPhone').value, email: document.getElementById('sEmail').value };
        staffList.push(s);
        localStorage.setItem('metro_staff', JSON.stringify(staffList));
        renderStaff();
        document.getElementById('staffRegModal').style.display = 'none';
    };

    document.getElementById('addEquipBtn').onclick = () => {
        const n = prompt("Equipment Name:");
        if(n) {
            equipment.push({ name: n, status: 'Active', due: '2025-12-30' });
            localStorage.setItem('metro_equipment', JSON.stringify(equipment));
            renderEquipment();
        }
    };

    // HELPERS
    function deleteItem(type, id) {
        if(!confirm("Are you sure?")) return;
        if(type==='member') gymMembers = gymMembers.filter(m => m.id !== id);
        else if(type==='staff') staffList = staffList.filter(s => s.id !== id);
        else equipment.splice(id, 1);
        
        localStorage.setItem('metro_members', JSON.stringify(gymMembers));
        localStorage.setItem('metro_staff', JSON.stringify(staffList));
        localStorage.setItem('metro_equipment', JSON.stringify(equipment));
        renderAll();
    }

    function sendWA(phone, name, expiry) {
        const msg = `*METRO FITNESS RECEIPT*%0AHello ${name}, your membership is confirmed!%0AValid until: ${expiry}%0AStay Strong! 💪`;
        window.open(`https://wa.me/91${phone.replace(/\D/g,'')}?text=${msg}`, '_blank');
    }

    document.getElementById('memberSearch').oninput = renderMembers;
    document.getElementById('logoutBtn').onclick = () => location.reload();
    document.getElementById('broadcastReminderBtn').onclick = () => {
        const expiring = gymMembers.filter(m => (new Date(m.expiryDate) - new Date()) / (1000*60*60*24) <= 3);
        alert(`Found ${expiring.length} members expiring soon. Send them reminders individually using the WhatsApp icon.`);
    };
</script>
</body>
</html>
